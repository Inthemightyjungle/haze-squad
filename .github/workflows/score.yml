# Records scores posted from the game. The game's "Post my best scores" button opens a
# ready-made issue titled "Score: …"; this workflow checks it, updates leaderboard.json,
# replies with the player's ranks and closes the issue.
name: Record score

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  record:
    if: startsWith(github.event.issue.title, 'Score:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update the leaderboard
        id: rec
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "haze-squad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # retry on top of the newest leaderboard if someone else's score landed first
          for i in 1 2 3 4 5 6; do
            git fetch -q origin "$BRANCH"
            git reset -q --hard "origin/$BRANCH"
            : > "$RUNNER_TEMP/out"
            GITHUB_OUTPUT="$RUNNER_TEMP/out" node scripts/record-score.js
            git add leaderboard.json
            if git diff --cached --quiet; then break; fi
            git commit -q -m "Leaderboard: scores from @$ISSUE_USER"
            if git push -q origin "HEAD:$BRANCH"; then break; fi
            sleep $((RANDOM % 6 + 3))
          done
          cat "$RUNNER_TEMP/out" >> "$GITHUB_OUTPUT"

      - name: Hide a name that breaks the rules
        if: steps.rec.outputs.hide == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue edit "$NUMBER" --repo "$REPO" --title "Score: (name removed)" --body "The name in this score broke Haze Squad's name rules, so it was removed."

      - name: Reply and close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ steps.rec.outputs.message }}
          NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$NUMBER" --repo "$REPO" --body "$MESSAGE"
          gh issue close "$NUMBER" --repo "$REPO" --reason completed
